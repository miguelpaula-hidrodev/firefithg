name: "Build Nintendo DS Game"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-ds:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Essentials
      run: |
        sudo apt-get update && sudo apt-get install -y make

    - name: Compile Game (Make)
      run: |
        # Configura as variáveis globais que apontam para o compilador interno da imagem
        export DEVKITPRO=/opt/devkitpro
        export DEVKITARM=$DEVKITPRO/devkitARM
        
        # Executa a compilação baseada no seu Makefile
        make

    - name: Upload Nintendo DS ROM (.nds)
      uses: actions/upload-artifact@v4
      with:
        name: WW3DoomDS-ROM
        path: "*.nds"
